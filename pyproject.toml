[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mnist"
version = "0.1.0"
description = "Measure TypeSafe Jev 1.14's accuracy at recognizing MNIST handwritten digits from images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.7.5",
    "numpy>=1.26",
    "pillow>=11.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jev-mnist = "jev_mnist.main:main"

[tool.setuptools]
packages = ["jev_mnist"]
